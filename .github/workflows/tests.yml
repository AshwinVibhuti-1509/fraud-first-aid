name: Review Candidate Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application requirements
        run: python -m pip install -r requirements.txt
      - name: Run application regression suite
        run: python self_check.py
      - name: Check guided JavaScript syntax
        run: node --check static/guided.js
